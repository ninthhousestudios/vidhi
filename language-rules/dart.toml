# Dart/Flutter forbidden_pattern rules catalog
#
# Skills (vidhi-sutra-seed, vidhi-sutra-adopt, vidhi-sutra-tend) read this
# catalog and propose relevant rules during governance setup. Each [[rule]]
# maps a coding_discipline principle to an enforceable tree-sitter query.
#
# Queries are tree-sitter S-expressions validated against tree-sitter-dart.
# Sutra validates at parse_rules time — invalid queries become parse errors.
# NOTE: Dart queries should be validated against a real Dart project at
# adoption time; the grammar node names may need adjustment.

[[rule]]
name = "no-dynamic-type"
principle = "Strict Typing (No Dynamic)"
query = '((type_identifier) @match (#eq? @match "dynamic"))'
recommended_severity = "advisory"
scope_hint = "lib/"
provenance_hint = "CLAUDE.md coding_discipline"
description = """
Detects use of `dynamic` as a type annotation. Dynamic types escape Dart's \
type system entirely — no compile-time checks, no autocompletion, runtime \
errors instead of compile-time errors."""
false_positives = """
JSON deserialization boundaries (Map<String, dynamic> from dart:convert), \
platform channel message handling, reflection-heavy code. These are genuine \
dynamic boundaries — waive with rationale."""
guidance = """
Replace with generics (<T>), explicit interface types, or Object with \
type checks. If the dynamic boundary is genuine (JSON parsing, platform \
channels), waive and document why the type can't be narrowed."""

[[rule]]
name = "no-bang-null-assertion"
principle = "Defensive Null Safety"
query = '(null_assertion_expression) @match'
recommended_severity = "advisory"
scope_hint = "lib/"
provenance_hint = "CLAUDE.md coding_discipline"
description = """
Detects the `!` null-assertion operator. Bang assertions trade a compile-time \
null check for a runtime exception — they're a bet that the value is never \
null, with a crash as the penalty for being wrong."""
false_positives = """
Widget test finders (find.byType(X).evaluate().single.widget as X — always \
non-null after find succeeds), late-initialized fields accessed after \
guaranteed init, framework callbacks where null is structurally impossible. \
Query may need grammar validation — postfix_expression node name varies."""
guidance = """
Use null-coalescing (?? with a default), conditional access (?.), or explicit \
null checks (if (x != null)). If the value is structurally guaranteed non-null, \
consider late or a redesign that eliminates the nullable type."""

[[rule]]
name = "no-ignore-comments"
principle = "Lint layer tamper-resistance"
query = '((comment) @match (#match? @match "^//+ *ignore(_for_file)?:"))'
recommended_severity = "blocking"
scope_hint = "lib/"
provenance_hint = "house analysis_options.yaml baseline"
description = """
Detects `// ignore:` and `// ignore_for_file:` comments — the analyzer's lint \
escape hatch. Models under pressure to get a clean `dart analyze` silence \
lints instead of fixing the underlying issue; these comments make every \
analyzer diagnostic optional. Blocking them makes the shared \
analysis_options.yaml baseline tamper-resistant: the sanctioned paths are \
fixing the code or an out-of-band waiver with rationale. Validated against \
tree-sitter-dart on a real workspace 2026-07 (`(comment)` matches `//` line \
comments; doc comments are a separate node)."""
false_positives = """
Generated code (*.g.dart, *.freezed.dart) carries `// ignore_for_file:` \
headers by design — but it is emitted by build_runner, not hand-edited, so it \
rarely crosses the edit-time guard; batch-waive if it flags. The analyzer \
baseline excludes generated globs for the same reason. Adopting in a \
brownfield project: existing hand-written ignores will all flag — waive in a \
batch or start advisory."""
guidance = """
First choice: fix the diagnostic. Unlike Rust there is no #[expect] analog — \
the analyzer offers no self-expiring suppression — so the only sanctioned \
suppression is sutra_constraints action=waive with a rationale naming the \
specific lint and why it cannot be fixed. Never `// ignore_for_file:` a \
hand-written file."""

# --- Principles covered elsewhere ---
#
# Enforce Const Constructors: not a sutra rule (missing-const detection is
#   possible but very noisy) — enforced by the shared analysis_options.yaml
#   baseline via prefer_const_constructors and friends (see vidhi-dart/).
#
# Cascade & Collection Operators: absence detection would require
#   required_pattern, explicitly deferred in sutra's design — enforced by the
#   analyzer baseline via cascade_invocations, prefer_spread_collections,
#   prefer_if_elements_to_conditional_expressions.
