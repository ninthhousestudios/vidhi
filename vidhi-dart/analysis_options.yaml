# House Dart analyzer baseline. Canonical copy: vidhi/vidhi-dart/analysis_options.yaml
#
# Adoption: copy into the project root (or, in a multi-package repo, copy to the
# repo root and give each package `include: ../analysis_options.yaml`).
# Flutter projects: swap the include for package:flutter_lints/flutter.yaml
# (flutter_lints in dev_dependencies); pure Dart projects use package:lints.
# Append project-specific analyzer excludes below the generated-code globs —
# never remove the strict modes or baseline rules. Escalations (a rule to
# "error") are fine; the baseline is a floor, not a ceiling.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Strict typing (coding_discipline: no dynamic)
    - avoid_dynamic_calls
    # Async hygiene: a Future silently dropped is a fire-and-forget bug
    - unawaited_futures
    # Errors: throw only Error/Exception, log properly.
    #
    # avoid_catches_without_on_clauses was here and was REMOVED 2026-07-27
    # (swe-dashboard/93), the first time this baseline met a live codebase.
    # It is a Java/C# rule: it assumes the callee's signature tells you what
    # can be thrown. Dart has no checked exceptions, so naming a type is a
    # guess — and the rule demands one in exactly the position where the
    # correct answer is "anything": the bare backstop after a typed clause,
    # which is how an error boundary is written.
    #
    #   try { ... } on FooException catch (e) { ... } catch (e) { /* backstop */ }
    #
    # Guessing there converts graceful degradation into an uncaught crash.
    # In the three repos that had adopted this baseline it produced zero fixes
    # and three permanently-red analyzers, i.e. it cost the ability to use
    # `dart analyze` as a gate at all and returned nothing.
    #
    # It did catch one real thing: catch blocks that swallow in silence. That
    # signal is worth keeping and is NOT covered here — `empty_catches` (already
    # in lints/recommended) exempts `catch (_) {}`, which is precisely the form
    # people write. It is satisfied by a comment in the block, so the house rule
    # is prose: an empty catch must say why silence is correct.
    - only_throw_errors
    - avoid_print
    # const discipline (coding_discipline: Enforce Const Constructors)
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    # Immutability at the variable level
    - prefer_final_locals
    - prefer_final_in_for_each
    # Cascade & collection operators (coding_discipline)
    #
    # cascade_invocations: turn this OFF in test/ via a nested
    # test/analysis_options.yaml (`include: ../analysis_options.yaml` plus
    # `cascade_invocations: false`). Reviewed against ~117 real sites across
    # four repos @ swe-dashboard/93 and KEPT for lib/ — most of what it produces
    # there is an improvement, and where the output is ugly it is usually
    # pointing at code that wants restructuring rather than restyling.
    #
    # Tests are the exception on merit, not frequency (it splits about evenly
    # between lib and test): a test is arrange/act/assert, so a repeated
    # receiver is structure rather than duplication, and a call that throws
    # inside a cascade is attributed to the declaration line — the wrong answer
    # exactly when you are reading a test failure. The shape that makes this
    # obvious, from swisseph.rs.dart:
    #
    #   final eph = Ephemeris(config);
    #   eph.close();
    #   eph.close();          // the sequence IS the assertion
    - cascade_invocations
    - prefer_spread_collections
    - prefer_if_elements_to_conditional_expressions
    # Explicit contracts
    - always_declare_return_types
